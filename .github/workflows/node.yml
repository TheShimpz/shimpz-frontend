name: Node

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26.11.1
      - name: Verify package contract
        run: |
          test "$(node --version)" = "v26.11.1"
          node -e '
            const manifest = require("./package.json");
            if (
              manifest.name !== "@shimpz/frontend" ||
              !/^\d+\.\d+\.\d+$/.test(manifest.version) ||
              manifest.license !== "Apache-2.0" ||
              manifest.private !== false ||
              manifest.engines.node !== "26.x" ||
              manifest.packageManager !== "pnpm@11.9.0"
            ) process.exit(1);
          '
      - name: Install the pinned pnpm
        run: |
          sh bootstrap-pnpm.sh "${RUNNER_TEMP}/pnpm-cache" "${RUNNER_TEMP}/pnpm"
          echo "${RUNNER_TEMP}/pnpm/bin" >> "${GITHUB_PATH}"
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Svelte
        run: pnpm check
      - name: Build package and showcase
        run: pnpm build
      - name: Test the packed package in a consumer
        run: pnpm test:package
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Test built showcase
        run: |
          processors="$(getconf _NPROCESSORS_ONLN 2>/dev/null || nproc)"
          workers="$(( processors / 2 ))"
          test "${workers}" -ge 1 || workers=1
          pnpm exec playwright test --workers="${workers}"
