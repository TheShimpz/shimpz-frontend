name: Node

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.0
      - name: Verify package contract
        run: |
          test "$(node --version)" = "v24.18.0"
          node -e '
            const manifest = require("./package.json");
            if (
              manifest.name !== "@shimpz/frontend" ||
              !/^\d+\.\d+\.\d+$/.test(manifest.version) ||
              manifest.license !== "Apache-2.0" ||
              manifest.private !== false ||
              manifest.engines.node !== "24.x" ||
              manifest.packageManager !== "pnpm@11.9.0"
            ) process.exit(1);
          '
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Check Svelte
        run: corepack pnpm check
      - name: Build package and showcase
        run: corepack pnpm build
      - name: Test the packed package in a consumer
        run: corepack pnpm test:package
      - name: Install Chromium
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Test built showcase
        run: |
          processors="$(getconf _NPROCESSORS_ONLN 2>/dev/null || nproc)"
          workers="$(( processors / 2 ))"
          test "${workers}" -ge 1 || workers=1
          corepack pnpm exec playwright test --workers="${workers}"
